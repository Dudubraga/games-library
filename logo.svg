<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Glow filter -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088aa"/>
    </linearGradient>
  </defs>

  <!-- Connecting lines (behind people) -->
  <!-- Top horizontal -->
  <line x1="32" y1="22" x2="68" y2="22" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Bottom horizontal -->
  <line x1="32" y1="78" x2="68" y2="78" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Left vertical -->
  <line x1="22" y1="32" x2="22" y2="68" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Right vertical -->
  <line x1="78" y1="32" x2="78" y2="68" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Person: Top-left (22, 22) -->
  <circle cx="22" cy="13" r="5" fill="none" stroke="#00d4ff" stroke-width="2.2" filter="url(#glow)"/>
  <path d="M13 30 Q13 22 22 22 Q31 22 31 30" fill="none" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Person: Top-right (78, 22) -->
  <circle cx="78" cy="13" r="5" fill="none" stroke="#00d4ff" stroke-width="2.2" filter="url(#glow)"/>
  <path d="M69 30 Q69 22 78 22 Q87 22 87 30" fill="none" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Person: Bottom-left (22, 78) -->
  <circle cx="22" cy="69" r="5" fill="none" stroke="#00d4ff" stroke-width="2.2" filter="url(#glow)"/>
  <path d="M13 86 Q13 78 22 78 Q31 78 31 86" fill="none" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Person: Bottom-right (78, 78) -->
  <circle cx="78" cy="69" r="5" fill="none" stroke="#00d4ff" stroke-width="2.2" filter="url(#glow)"/>
  <path d="M69 86 Q69 78 78 78 Q87 78 87 86" fill="none" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Number 4 in center -->
  <text
    x="50" y="57"
    text-anchor="middle"
    font-family="Orbitron, monospace"
    font-size="28"
    font-weight="700"
    fill="#00d4ff"
    filter="url(#glow)"
  >4</text>
</svg>
